<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrypt Message</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        input, button { margin: 10px; padding: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Decryption</h2>
    <p> Welcome to Decryption! </p>
    <p> Please enter the exact cipher text, nonce and key to gain accurate results. </p>
    <form action="/decrypt" method="POST">
        <input type="text" name="ciphertext" placeholder="Enter encrypted text" required><br>
        <input type="text" name="key" placeholder="Enter key" required><br>
        <input type="text" name="nonce" placeholder="Enter nonce" required><br>
        <button type="submit">Decrypt</button>
    </form>

    {% if decrypted_message %}
        <p><b>Decrypted Message:</b> {{ decrypted_message }}</p>
    {% endif %}

    <br><a href="/">Back</a>
</body>
</html>
